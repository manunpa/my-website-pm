<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<style>html:not(.ready) body { visibility: hidden; }</style>
<script>try { if (localStorage.getItem('hub-theme') === 'dark') document.documentElement.dataset.theme = 'dark'; } catch (e) {}</script>
<title>ห้องดูการใช้งาน</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f5f3;--panel:#fff;--line:#dcdcd7;--ink:#1a1a1a;--mute:#6f6f6a;--ok:#1b7f4c;--no:#c0362c}
:root[data-theme=dark]{--bg:#161616;--panel:#1f1f1f;--line:#333;--ink:#ececea;--mute:#9a9a95;--ok:#4cc38a;--no:#ff6b5e;color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Thai',system-ui,sans-serif;line-height:1.5;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
h1{font-size:19px;margin:0}
a{color:inherit;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 12px;text-decoration:none;white-space:nowrap}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}
.total b{display:block;font-size:46px;line-height:1.15;color:var(--ok);font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse}
td{padding:10px 0;border-top:1px solid var(--line);vertical-align:top}
tr:first-child td{border-top:0}
td.n{width:48px;text-align:right;font-weight:600;font-size:18px;font-variant-numeric:tabular-nums}
small{display:block;color:var(--mute)}
#state{color:var(--mute);font-size:13px}
#state.bad{color:var(--no);font-size:15px}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>ห้องดูการใช้งาน</h1><a href="./Access-Hub.html">หน้าหลัก</a></header>
  <div class="panel total">อุปกรณ์ที่ใช้งานอยู่ตอนนี้<b id="total">–</b></div>
  <div class="panel"><table><tbody id="pages"></tbody></table></div>
  <p id="state" role="status">กำลังโหลด…</p>
</div>
<script type="module">
import { requireLogin, fetchProtectedText, PRESENCE_URL } from './firebase-guard.js?v=20261122-cut';

const NAMES = {
  'Access-Hub': 'หน้าหลัก', bbs: 'บันทึก BBS', 'access-maps': 'แผนที่', 'alert-mileage': 'Mileage Analysis',
  leo_dashboard: 'LEO System', truck_blind_spot_simulator: 'ฝึกขับรถ', train_simulator: 'ฝึกขับรถไฟ'
};
const $ = (id) => document.getElementById(id);
const say = (text, bad = false) => { $('state').textContent = text; $('state').className = bad ? 'bad' : ''; };

function row(name, count, detail) {
  const tr = document.createElement('tr');
  const left = tr.insertCell();
  left.textContent = name;
  if (detail) left.appendChild(document.createElement('small')).textContent = detail;
  const right = tr.insertCell();
  right.className = 'n';
  right.textContent = count;
  return tr;
}

async function refresh() {
  if (document.visibilityState !== 'visible') return;
  try {
    const data = JSON.parse(await fetchProtectedText(PRESENCE_URL, { action: 'view' }));
    $('total').textContent = data.total;
    const list = Object.entries(data.pages).sort((a, b) => b[1].count - a[1].count);
    $('pages').replaceChildren(...(list.length
      ? list.map(([page, info]) => row(NAMES[page] || page, info.count,
          Object.entries(info.kinds).map(([kind, n]) => kind + ' ' + n).join(' · ')))
      : [row('ยังไม่มีใครใช้งาน', '', '')]));
    say('อัปเดต ' + new Date().toTimeString().slice(0, 8) + ' น. · รีเฟรชเองทุก 30 วินาที · นับเครื่องที่เปิดหน้าจออยู่ใน 2–3 นาทีล่าสุด');
  } catch (err) {
    say(err.message, true);
  }
}

requireLogin(() => {
  if (!PRESENCE_URL) { say('ยังไม่ได้ติดตั้งตัวนับ (apps-script/presence.gs)', true); return; }
  refresh();
  setInterval(refresh, 30000);
  document.addEventListener('visibilitychange', refresh);
});
</script>
</body>
</html>
