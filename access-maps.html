<style>
:root{--bg:#f4f7fb;--panel:#fff;--panel2:#f8fafc;--text:#182230;--muted:#718096;--border:#e5eaf1;--accent:#4776ff;--accent2:#8b5cf6;--shadow:0 8px 28px #1d355710;--top:#ffffffeb;--map-filter:none}
body.dark{--bg:#0b1220;--panel:#111b2b;--panel2:#162235;--text:#e8eef8;--muted:#91a0b8;--border:#26354a;--accent:#6d91ff;--accent2:#b08cff;--shadow:0 8px 28px #0004;--top:#111b2beF}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Inter,Kanit,sans-serif;background:var(--bg);color:var(--text);overflow:hidden}
button,input{font:inherit}button{cursor:pointer}
.app{height:100dvh;display:flex;flex-direction:column}
.topbar{height:78px;flex:0 0 78px;background:var(--top);backdrop-filter:blur(18px);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:22px;padding:0 24px;z-index:1000}
.brand{display:flex;align-items:center;gap:13px;min-width:255px}
.brandmark{width:43px;height:43px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,#4776ff,#9b5cff);box-shadow:0 7px 18px #4776ff40;color:white;font-size:23px}
.brand h1{margin:0;font-size:25px;line-height:1;font-weight:800;letter-spacing:-1px;background:linear-gradient(90deg,#4776ff,#8d5cf6,#16c7bd,#4776ff);background-size:200% auto;color:transparent;background-clip:text;-webkit-background-clip:text;animation:shine 5s linear infinite}
/* ไล่สีวนต่อเนื่อง: เลื่อนพอดี 1 รอบของสีพื้นหลัง (ขนาด 200% ↔ เลื่อน 200%) จุดเริ่มกับจุดจบจึงต่อกันสนิท ไม่กระตุก */
@keyframes shine{from{background-position:0% center}to{background-position:200% center}}
.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:2.1px;margin-top:6px;font-weight:700}
.top-status{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px;margin-left:auto;white-space:nowrap}
.live-dot{width:8px;height:8px;background:#20c997;border-radius:50%;box-shadow:0 0 0 4px #20c99720}
.actions{display:flex;align-items:center;gap:9px}
.iconbtn,.mapbtn{border:1px solid var(--border);color:var(--text);background:var(--panel);height:39px;min-width:39px;padding:0 12px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:.2s;font-weight:600;font-size:12px}
.iconbtn:hover,.mapbtn:hover{border-color:var(--accent);transform:translateY(-1px)}
.logout{color:#e05260}
.main{display:flex;flex:1;min-height:0;position:relative}
.sidebar{width:325px;min-width:325px;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;z-index:500;transition:width .25s,min-width .25s,transform .25s;overflow:hidden}
.sidebar.collapsed{width:0;min-width:0;border-right:0}
.sidehead{padding:22px 18px 16px;border-bottom:1px solid var(--border);min-width:325px}
.side-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}
.side-title h2{font-size:15px;margin:0;font-weight:700}
.count{font-size:11px;color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent);padding:5px 9px;border-radius:8px;font-weight:700}
.searchwrap{position:relative}
.searchwrap span{position:absolute;left:12px;top:10px;color:var(--muted)}
.searchwrap .searchclear{position:absolute;right:5px;top:5px;width:29px;height:29px;border:0;border-radius:8px;background:transparent;color:var(--muted);font-size:13px;display:grid;place-items:center;padding:0}
.searchwrap .searchclear:hover{background:var(--border);color:var(--text)}
.searchwrap .searchclear[hidden]{display:none}
.searchwrap input{width:100%;height:39px;padding:0 36px 0 36px;border:1px solid var(--border);background:var(--panel2);border-radius:11px;color:var(--text);outline:none;font-size:12px}
.searchwrap input:focus{border-color:var(--accent);box-shadow:0 0 0 3px #4776ff18}
.filterline{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px}
.supplierselect{flex:1 1 100%;width:100%;height:33px;padding:0 10px;border:1px solid var(--border);background:var(--panel2);color:var(--text);border-radius:8px;font-size:11px;outline:none;cursor:pointer}
.supplierselect:focus,.supplierselect.on{border-color:var(--accent)}
.supplierselect.on{background:color-mix(in srgb,var(--accent) 10%,var(--panel2));font-weight:600}
.pointsup{color:var(--accent);font-weight:600}
.chip{font-size:10px;color:var(--muted);border:1px solid var(--border);border-radius:8px;padding:6px 9px;background:transparent}
.chip.active{background:var(--accent);border-color:var(--accent);color:#fff}
.pointlist{padding:8px;overflow:auto;flex:1;min-width:325px}
.pointrow{display:flex;align-items:center;gap:11px;padding:12px 10px;border-radius:12px;cursor:pointer;border:1px solid transparent;transition:.15s}
.pointrow:hover{background:var(--panel2);border-color:var(--border)}
.pointrow.selected{background:color-mix(in srgb,var(--accent) 9%,var(--panel));border-color:color-mix(in srgb,var(--accent) 35%,transparent)}
.pin{width:35px;height:35px;border-radius:11px;background:color-mix(in srgb,var(--accent) 13%,transparent);color:var(--accent);display:grid;place-items:center;flex-shrink:0;font-size:16px}
.pointinfo{min-width:0;flex:1}
.pointname{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pointcoord{font-size:10px;color:var(--muted);margin-top:5px;font-variant-numeric:tabular-nums}
.pointarrow{color:var(--muted);font-size:17px}
.sidefoot{border-top:1px solid var(--border);padding:13px 18px;min-width:325px;display:flex;justify-content:space-between;color:var(--muted);font-size:10px}
.maparea{flex:1;min-width:0;position:relative;background:#dce5ed}
/* โหมดมืด: กลับสีแผนที่ถนนให้มืด (หมุด/เส้น/ป๊อปอัปอยู่คนละชั้น ไม่โดนกลับสี) */
body.dark{--map-filter:invert(1) hue-rotate(180deg) brightness(.92) contrast(.88) saturate(.75)}
body.dark .maparea,body.dark .leaflet-container{background:#0e1726}
.street-tiles{filter:var(--map-filter)}
.leaflet-control-attribution{background:var(--top) !important;color:var(--muted)}
.leaflet-control-attribution a{color:var(--accent)}
body.dark .leaflet-bar a{background:var(--panel);color:var(--text);border-color:var(--border)}
#map{height:100%;width:100%;z-index:1}
.mapcontrols{position:absolute;top:17px;left:17px;right:17px;display:flex;justify-content:space-between;align-items:flex-start;z-index:400;pointer-events:none;gap:10px}
.mapcontrols>*{pointer-events:auto}
.map-switcher{display:flex;gap:5px;background:var(--top);backdrop-filter:blur(14px);padding:5px;border:1px solid var(--border);border-radius:13px;box-shadow:var(--shadow)}
.mapbtn{height:32px;border:0;background:transparent;min-width:auto;border-radius:9px;padding:0 12px;font-size:11px}
.mapbtn.active{background:var(--accent);color:white}
.mapright{display:flex;gap:8px}
.floating-card{background:var(--top);backdrop-filter:blur(16px);border:1px solid var(--border);box-shadow:var(--shadow);border-radius:14px;padding:12px 15px}
.statlabel{font-size:10px;color:var(--muted);font-weight:600}
.statvalue{font-size:20px;font-weight:800;letter-spacing:-.5px;margin-top:3px}
.statvalue em{font-style:normal;color:var(--accent)}
.mapstats{display:flex;gap:8px}
.mapstats .floating-card{min-width:104px}
.mapbottom{position:absolute;bottom:20px;left:17px;right:68px;/* เว้นที่ด้านขวาให้ปุ่มซูม/ตำแหน่งของฉัน ไม่ให้กล่องพิกัดทับ */display:flex;justify-content:space-between;align-items:flex-end;z-index:400;pointer-events:none}
.mapbottom>*{pointer-events:auto}
.legend{display:flex;gap:15px;align-items:center;font-size:10px;color:var(--muted)}
.legend .floating-card{display:flex;gap:13px;align-items:center;padding:11px 13px}
.legend-item{display:flex;align-items:center;gap:6px;white-space:nowrap}
.legend-dot{width:8px;height:8px;border-radius:50%;background:#4776ff}
.legend-dot.cluster{background:#8b5cf6}
.coordinates{font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;flex-shrink:0}
.leaflet-container{font-family:Inter,Kanit,sans-serif}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--panel);color:var(--text)}
.leaflet-popup-content{font-family:Inter,Kanit,sans-serif;font-size:12px}
.popup-title{font-weight:700;margin-bottom:5px}
.popup-coord{font-size:10px;color:var(--muted)}
.ptt-detail{font-size:11px;line-height:1.45;margin:2px 0 6px}
.ptt-type,.ptt-prov{display:inline-block;font-size:10px;font-weight:700;padding:1px 7px;border-radius:999px;margin:0 4px 5px 0;background:#00a3e0;color:#fff}
.ptt-prov{background:var(--panel2);color:var(--text);border:1px solid var(--border)}
.ptt-line{margin:2px 0}.ptt-line b{color:var(--muted);font-weight:600;margin-right:2px}
.ptt-sec{font-size:10px;font-weight:700;color:var(--muted);margin:6px 0 3px}
.ptt-chips{display:flex;flex-wrap:wrap;gap:3px;max-height:84px;overflow:auto}
.ptt-chips span{font-size:10px;padding:1px 6px;border-radius:6px;background:var(--panel2);border:1px solid var(--border)}
.ptt-link{display:inline-block;margin-top:6px;font-size:11px;font-weight:600}
.locatebtn{width:40px;height:40px;margin-bottom:8px !important;border-radius:12px;border:1px solid var(--border);background:var(--panel);color:var(--text);display:grid;place-items:center;box-shadow:var(--shadow);cursor:pointer;padding:0}
.locatebtn:hover{border-color:var(--accent);color:var(--accent)}
.locatebtn.on{color:#1a73e8;border-color:#1a73e8}
.locatebtn.follow{background:#1a73e8;color:#fff;border-color:#1a73e8;box-shadow:0 0 0 4px #1a73e833,var(--shadow)}
.locatebtn.busy svg{animation:spin 1s linear infinite;color:var(--accent)}
.mypos{width:22px;height:22px;border-radius:50%;background:#1a73e8;border:3px solid #fff;box-shadow:0 0 0 0 #1a73e855,0 2px 8px #0005;animation:mypulse 2s ease-out infinite}
/* เส้นประไหลจากตัวเรา → ไปหา Geofence (บอกให้รู้ว่าเส้นยังทำงานอยู่) */
.nearline{animation:nearflow 1s linear infinite}
.nearline.first{animation-duration:.7s}
@keyframes nearflow{to{stroke-dashoffset:-12}}
@media(prefers-reduced-motion:reduce){.nearline{animation:none}}
/* ป้ายระยะทางบนเส้นประ (5 จุดที่ใกล้ที่สุด) */
.distlabel-wrap{background:none;border:0;width:0!important;height:0!important}
.distlabel{position:absolute;left:0;top:0;transform:translate(-50%,-50%);white-space:nowrap;padding:1px 6px;border-radius:8px;
  font:600 10px/1.5 Inter,Kanit,sans-serif;font-variant-numeric:tabular-nums;color:#4776ff;background:var(--panel);border:1px solid #4776ff66;box-shadow:0 1px 4px #0002;pointer-events:none}
.distlabel.first{color:#fff;background:#e05260;border-color:#e05260;font-size:11px}
/* อันดับ 2 = สีเหลือง (ตัวอักษรเข้มให้อ่านง่ายบนพื้นเหลือง) */
.distlabel.second{color:#3d2e00;background:#f2b705;border-color:#d9a300;font-size:10.5px}
/* ลูกศรทิศทางบนจุดสีฟ้า (แสดงเฉพาะตอนรถวิ่งและ GPS ส่งทิศทางมา) */
.mypos{position:relative}
.mypos-arrow{position:absolute;left:50%;top:50%;width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-bottom:9px solid #1a73e8;transform:translate(-50%,-50%) rotate(var(--hd,0deg)) translateY(-16px);opacity:0;transition:opacity .3s;filter:drop-shadow(0 0 1.5px #fff) drop-shadow(0 0 1px #fff)}
.mypos.moving .mypos-arrow{opacity:1}
@keyframes mypulse{0%{box-shadow:0 0 0 0 #1a73e866,0 2px 8px #0005}100%{box-shadow:0 0 0 16px #1a73e800,0 2px 8px #0005}}
.nearbar{position:absolute;top:92px;left:50%;transform:translateX(-50%);z-index:450;display:flex;align-items:center;gap:9px;max-width:min(520px,calc(100% - 24px));padding:10px 14px;border-radius:14px;border:1px solid var(--border);background:var(--top);backdrop-filter:blur(16px);box-shadow:var(--shadow);color:var(--text);font-size:13px;cursor:pointer}
.nearbar[hidden]{display:none}
.nearbar .nb-dot{width:10px;height:10px;border-radius:50%;background:#1a73e8;flex-shrink:0}
.nearbar.following .nb-dot{animation:mypulse 1.6s ease-out infinite}
.nearbar .nb-label{font-size:11px;color:var(--muted);flex-shrink:0}
.nearbar .nb-name{font-weight:600;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nearbar .nb-dist{font-weight:800;font-size:16px;color:#e05260;flex-shrink:0;font-variant-numeric:tabular-nums;margin-left:4px}
@media(max-width:850px){.nearbar{top:70px;font-size:12px;padding:9px 12px}.nearbar .nb-dist{font-size:15px}}
.recenter{position:absolute;bottom:72px;left:50%;transform:translateX(-50%);z-index:450;height:42px;padding:0 18px;border-radius:21px;border:0;background:#1a73e8;color:#fff;font-weight:700;font-size:13px;box-shadow:0 6px 18px #1a73e855;cursor:pointer;white-space:nowrap}
.recenter[hidden]{display:none}
.suppin{background:none;border:0}
.suppin svg{display:block;filter:drop-shadow(0 2px 3px #0005)}
.legend .floating-card{flex-wrap:wrap;row-gap:7px;max-width:min(640px,calc(100vw - 120px))}
.suplegend{display:contents}
.legend-item.sup{border:0;background:none;padding:0;font:inherit;color:inherit;cursor:pointer}
.legend-item.sup:hover{color:var(--text)}
.legend-item.sup.on{color:var(--text);font-weight:700}
.legend-item.sup.dim{opacity:.4}
/* ===== แยก Geofence กับปั๊มน้ำมัน ===== */
.legend[hidden]{display:none}
.legend .floating-card:has(.legrow){flex-direction:column;align-items:stretch;gap:7px}
.legrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px}
/* มือถือ: คำอธิบายสัญลักษณ์แถวละบรรทัดเดียว เลื่อนซ้าย-ขวาได้ (ไม่สูงบังแผนที่) · ชื่อ Access Maps ไม่ตัดบรรทัด */
@media(max-width:850px){.legend .floating-card:has(.legrow){max-width:calc(100vw - 78px);padding:8px 10px}.legrow{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}.legrow::-webkit-scrollbar{display:none}.leghead{min-width:auto;flex-shrink:0}.legrow .legend-item{flex-shrink:0}}
@media(max-width:470px){.brand h1{font-size:19px;white-space:nowrap}#sidebarToggle span{display:none}}
.legrow+.legrow{padding-top:7px;border-top:1px solid var(--border)}
.leghead{font-weight:700;color:var(--text);min-width:64px}
.legend-dot.drop{border-radius:50% 50% 50% 0;transform:rotate(-45deg);width:9px;height:9px}
.legend-dot.fuel{width:11px;height:11px;box-shadow:0 0 0 1.5px #fff,0 0 0 2.5px #0002}
.stpin{background:none;border:0}
.stpin div{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;border:2px solid #fff;box-shadow:0 2px 4px #0005;box-sizing:border-box}
.stpin svg{display:block}
.stcluster{background:none;border:0}
.stcluster div{display:flex;align-items:center;justify-content:center;gap:2px;border-radius:50%;background:#0f2f3d;color:#fff;font:700 11px/1 Inter,Kanit,sans-serif;border:3px solid #00a3e0;box-shadow:0 0 0 4px #00a3e033,0 2px 6px #0005;box-sizing:border-box}
.stcluster b{font-size:10px;font-weight:400}
.layercard{text-align:left;cursor:pointer;font:inherit;color:inherit;transition:.15s;border-width:1.5px}
.layercard:hover{border-color:var(--accent)}
.layercard.on{border-color:var(--accent)}
.layercard.st.on{border-color:#00a3e0}
.layercard:not(.on){opacity:.6}
.layercard .statvalue small{font-size:12px;font-weight:600;color:var(--muted)}
.lc-check{display:inline-grid;place-items:center;width:12px;height:12px;border-radius:4px;border:1.5px solid var(--muted);margin-right:5px;vertical-align:-2px;font-size:9px;line-height:1;color:#fff}
.layercard.on .lc-check{background:var(--accent);border-color:var(--accent)}
.layercard.st.on .lc-check{background:#00a3e0;border-color:#00a3e0}
.layercard.on .lc-check::after{content:"✓"}
.pin.fuel svg{width:17px;height:17px}
.nearhead.st{margin-top:12px;border-top:1px solid var(--border);padding-top:12px}
.nearbar{flex-direction:column;align-items:stretch;gap:6px}
.nb-row{display:flex;align-items:center;gap:9px;min-width:0}
.nb-row.nb-st{padding-top:6px;border-top:1px solid var(--border)}
.nb-fuel{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:10px;flex-shrink:0;margin:0 -4px}
.nearbar .nb-st .nb-dist{color:#00a3e0;font-size:14px}
.dupbadge{display:inline-block;margin-left:4px;padding:0 6px;border-radius:6px;font-size:9px;font-weight:600;color:#8a4b00;background:#fff4db;border:1px solid #f2c46d;vertical-align:1px}
.listmore{display:block;width:100%;margin:6px 0 10px;padding:11px;border:1px dashed var(--border);border-radius:11px;background:transparent;color:var(--muted);font-size:11px;cursor:pointer}
.listmore:hover{border-color:var(--accent);color:var(--accent)}
/* มือถือ: ตอนแถบรายการเปิด ทำให้แผนที่ด้านข้างมืดลง บอกว่าแตะเพื่อปิดได้ */
@media(max-width:850px){.maparea::after{content:"";position:absolute;inset:0;background:#0b122066;z-index:1200;opacity:0;pointer-events:none;transition:opacity .25s}.main:has(.sidebar:not(.collapsed)) .maparea::after{opacity:1;pointer-events:auto}.sidebar{z-index:1300}}
.selpin{background:none;border:0}

/* โหมดแอป: แถบบนสูงขึ้นเท่ารอยบาก/Dynamic Island, ด้านข้าง/ล่างเว้นขอบจอโค้งและแถบโฮม (เบราว์เซอร์ปกติเป็น 0) */
.topbar{padding-top:env(safe-area-inset-top);height:calc(78px + env(safe-area-inset-top));flex-basis:calc(78px + env(safe-area-inset-top))}

/* แผนที่ลากยาวถึงขอบล่างสุด (ไม่มีแถบว่างใต้แผนที่) แต่ยกปุ่ม/คำอธิบาย/ข้อความลิขสิทธิ์ให้พ้นแถบโฮม */
.app{padding:0 env(safe-area-inset-right) 0 env(safe-area-inset-left)}

/* ปุ่มกลับหน้าหลัก (Hub): โหมดแอปไม่มีปุ่มย้อนกลับของเบราว์เซอร์ */
a.iconbtn{text-decoration:none}
.hubbtn{flex:none}
.brandmark{flex:none}
/* มือถือ: ปุ่ม Hub เหลือแค่ลูกศร ซ่อนโลโก้เล็กแทน เพื่อให้ชื่อ Access Maps ไม่ถูกบีบ */
@media(max-width:470px){.hubbtn span{display:none}.brandmark{display:none}.brand h1{overflow:hidden;text-overflow:ellipsis}}
/* พื้นหลังเส้นใย (ghost-fibers.js) เห็นผ่านแถบบนและแถบข้าง ส่วนแผนที่ทึบเหมือนเดิม
   พื้นรายชื่อทับอีกชั้นให้ตัวหนังสืออ่านง่าย · มือถือแถบข้างลอยทับแผนที่ จึงคงพื้นทึบไว้ */
:root{--fiber-a:#4776ff;--fiber-b:#6d3fe0;--fiber-alpha:1}
body.dark{--fiber-a:#6d91ff;--fiber-b:#d6c4ff;--fiber-alpha:.85}
body{position:relative;isolation:isolate}
.topbar{background:color-mix(in srgb,var(--panel) 35%,transparent);backdrop-filter:none}
@media(min-width:851px){

  .pointlist{background:color-mix(in srgb,var(--panel) 72%,transparent)}
  .chip:not(.active){background:var(--panel)}
  .sidefoot{background:color-mix(in srgb,var(--panel) 72%,transparent)}
}
/* ===== ฟังก์ชันที่ยกมาจาก my-web-p3 ===== */
/* ปุ่มแผนที่ซ้ายบน: OSM/Google · รูปแบบ · ชั้นเสริม Google */
.mapcontrols{flex-wrap:wrap}

.tiles-dark{filter:invert(1) hue-rotate(180deg) brightness(.92) contrast(.88) saturate(.75)}
.leaflet-google-mutant{background:transparent}
/* แถบใกล้สุดอยู่ใต้ปุ่มด้านบนเสมอ (--ctl-h วัดจากความสูงจริงของปุ่ม) */
.nearbar{top:calc(var(--ctl-h,58px) + 28px)}

.pdrive{color:#1a73e8;font-weight:700}
/* การ์ดชั้นออฟชอร์ */
.layercard.off.on{border-color:#0e7490}

.pop-area{font-size:11px;font-weight:600;margin-top:6px}

.pop-src{font-size:9.5px;color:var(--muted);margin-top:4px;line-height:1.4}
.popactions+.popactions{margin-top:6px}
/* หมุดจุดแวะ / จุดผ่าน / เส้นทาง */
.route-hit{cursor:copy}
.stop-marker,.via-marker{background:none;border:0}
.stop-marker span{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:#1a73e8;border:2px solid #fff;box-sizing:border-box;color:#fff;font:700 12px/1 Inter,sans-serif;box-shadow:0 2px 6px #0007}
.via-marker span{display:block;width:18px;height:18px;border-radius:50%;background:#fff;border:3px solid #1a73e8;box-sizing:border-box;box-shadow:0 2px 6px #0007;cursor:grab}

.planner{flex:none;margin:8px 8px 0;min-width:309px;border:1px solid var(--border);border-radius:12px;background:var(--panel);max-height:55%;overflow:auto}

.planner-actions{display:flex;flex-wrap:wrap;gap:6px}
.planbtn{display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 10px;border-radius:9px;border:1px solid var(--border);background:var(--panel2);color:var(--text);font-size:11px;font-weight:600;text-decoration:none;white-space:nowrap;cursor:pointer}

.planbtn svg{flex:none}

.planner-focus{display:flex;align-items:flex-start;gap:7px;line-height:1.4;cursor:pointer}

.planner-count{margin:0}
.along{list-style:none;margin:0;padding:0;display:grid;gap:2px}

/* กลางล่าง: สรุปเส้นทาง + แถบฝน */
.map-stack{position:absolute;z-index:460;left:50%;bottom:calc(var(--bot-h,40px) + 30px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;width:max-content;max-width:calc(100% - 140px);pointer-events:none}

.sv-x:hover{background:var(--panel2)}

</style>

      <div class="sidehead">
        <div class="side-title"><h2 id="sideTitleText">รายการ Geofence</h2><span class="count" id="pointCount">0 จุด</span></div>
        <div class="searchwrap"><span>⌕</span><input id="searchInput" placeholder="ค้นหาชื่อ หรือวางพิกัด เช่น 13.75, 100.50" autocomplete="off" enterkeyhint="search"><button type="button" class="searchclear" id="searchClear" title="ล้างการค้นหา" aria-label="ล้างการค้นหา" hidden>✕</button></div>
        <div class="filterline"><button class="chip active" data-filter="all">ทั้งหมด</button><button class="chip" data-filter="valid">มีพิกัด</button><button class="chip" data-filter="invalid">พิกัดไม่ครบ</button><button class="chip" data-filter="dup" title="Geofence ที่ชื่อหรือพิกัดซ้ำกัน">ข้อมูลซ้ำ</button><button class="chip" data-filter="view" title="เฉพาะจุดในขอบเขตแผนที่ เรียงจากใกล้กึ่งกลางจอ">ในจอนี้</button><select class="supplierselect" id="supplierSelect" title="กรองตาม Supplier"><option value="all">Supplier: ทั้งหมด</option></select><select class="supplierselect" id="brandSelect" title="กรองแบรนด์ปั๊มน้ำมัน" hidden><option value="all">⛽ ปั๊ม: ทุกแบรนด์</option></select></div>
      </div>
      <!-- วางแผนเส้นทาง (พับไว้) — maps.js วาดเนื้อหาใน #plannerBody -->
      <details class="planner" id="planner"><summary><span>🛣 วางแผนเส้นทาง</span> <span id="plannerCount" class="muted"></span></summary><div class="planner-body" id="plannerBody"></div></details>
      <div class="pointlist" id="pointList"><div class="empty"><span class="loading"></span>กำลังโหลดรายการพิกัด</div></div>
      <div class="sidefoot"><span id="sourceLabel">Google Sheets API</span><span id="lastUpdated">—</span></div>
    </aside>
    <section class="maparea">
      <div id="map"></div>
      <div class="mapcontrols">
        <!-- OSM / Google · รูปแบบแผนที่ · ชั้นเสริมของ Google (maps.js วาดปุ่ม) -->
        <div class="mapleft" id="baseControls"></div>
        <div class="mapright">
          <div class="mapstats">
            <!-- การ์ดตัวเลข = ปุ่มเปิด/ปิดชั้นข้อมูล (maps.js) -->
            <button type="button" class="floating-card layercard on" id="layerGeo" aria-pressed="true" title="เปิด/ปิด Geofence บนแผนที่"><div class="statlabel"><span class="lc-check"></span>Geofence</div><div class="statvalue" id="statGeo">—</div></button>
            <button type="button" class="floating-card layercard st" id="layerStations" aria-pressed="false" title="เปิด/ปิดปั๊มน้ำมันบนแผนที่"><div class="statlabel"><span class="lc-check"></span>⛽ ปั๊มน้ำมัน</div><div class="statvalue" id="statStations">—</div></button>
            <button type="button" class="floating-card layercard off" id="layerOffshore" aria-pressed="false" title="เปิด/ปิดแท่นผลิตและแปลงสัมปทานปิโตรเลียม (กรมเชื้อเพลิงธรรมชาติ)"><div class="statlabel"><span class="lc-check"></span>◆ ออฟชอร์</div><div class="statvalue" id="statOffshore">—</div></button>
          </div>
        </div>
      </div>
      <div class="mapbottom">
        <div class="legend"><div class="floating-card"><span id="supplierLegend" class="suplegend"><span class="legend-item"><span class="legend-dot"></span>จุดพิกัด</span></span></div></div>
        <div class="floating-card coordinates" id="cursorCoords">LAT — · LNG —</div>
      </div>
      <div class="nearbar" id="nearBar" role="group" hidden title="กดเพื่อไปที่จุดนี้"></div>
      <button type="button" class="recenter" id="recenterBtn" hidden>⌖ กลับมาที่ตำแหน่งฉัน</button>
      <!-- กลางล่าง: สรุปเส้นทาง + แถบเวลาเรดาร์ฝน (ซ้อนกันเอง ไม่ทับกัน) -->
      <div class="map-stack" id="mapStack">
        <div class="route-chip" id="routeChip" role="status" hidden></div>
        <div class="rain-bar" id="rainBar" role="group" aria-label="ชั้นฝน" hidden></div>
      </div>
      <div class="toast" id="toast"></div>
    </section>
  </main>
</div>
