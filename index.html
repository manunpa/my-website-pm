    <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns=%27http://www.w3.org/2000/svg%27%20viewBox=%2756%2056%20400%20400%27%3E%3Crect%20x=%2756%27%20y=%2756%27%20width=%27400%27%20height=%27400%27%20rx=%2790%27%20fill=%27%23111a2c%27/%3E%3Crect%20x=%27107%27%20y=%27107%27%20width=%27298%27%20height=%27298%27%20rx=%2726%27%20fill=%27%23e0e7f1%27/%3E%3Cpath%20d=%27M264%20107h115a26%2026%200%200%201%2026%2026v115H264z%27%20fill=%27%2327b0e6%27/%3E%3Cpath%20d=%27M256%20107v298M107%20256h298%27%20stroke=%27%23b4d2ec%27%20stroke-width=%2718%27/%3E%3Cpath%20d=%27M258%20253%20366%20146M315%20146h51v50%27%20fill=%27none%27%20stroke=%27%23fad21e%27%20stroke-width=%2726%27%20stroke-linecap=%27round%27%20stroke-linejoin=%27round%27/%3E%3C/svg%3E">

    <!-- ซ่อนหน้าไว้จนกว่า Firebase จะเช็กสถานะเสร็จ กันหน้ากระพริบและกันลูป -->
    <style>body { visibility: hidden; }</style>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // โทนสีดึงจากป้ายราคาน้ำมันบางจาก: เขียวหัวตาราง + เขียวตัวอักษร "ราคาน้ำมัน"
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Noto Sans Thai"', 'Tahoma', 'sans-serif'] },
                    colors: {
                        bc: {
                            50:  '#f4f9ea',
                            100: '#e6f2cf',
                            500: '#6cb200',   /* เขียวหัวตาราง */
                            600: '#5a9b00',
                            700: '#487c00',
                            text: '#3aa335'   /* เขียวตัวอักษร */
                        }
                    }
                }
            }
        };
    </script>
    <!-- ระยะขอบ 1rem และเว้นรอยบาก/Dynamic Island/ขอบจอโค้งเมื่อเปิดแบบแอป -->
    <style>
        body {
            padding: max(1rem, env(safe-area-inset-top)) max(1rem, env(safe-area-inset-right))
                     max(1rem, env(safe-area-inset-bottom)) max(1rem, env(safe-area-inset-left));
        }
    </style>
</head>
<body class="font-sans bg-bc-50 min-h-screen flex items-center justify-center">

    <div class="w-full max-w-4xl flex flex-col lg:flex-row items-center lg:items-stretch justify-center gap-6">

        <!-- ฝั่งเข้าสู่ระบบ -->
        <main class="w-full max-w-sm bg-white rounded-2xl shadow-lg overflow-hidden self-center">
            <div class="bg-bc-500 px-8 py-6 text-white">
                <h1 class="text-2xl font-bold">Access Hub</h1>
                <p class="text-sm text-white/90 mt-1">เข้าสู่ระบบเพื่อใช้งานระบบภายใน</p>
            </div>

            <!-- ลูกเล่นเทศกาลลอยกระทง: แบนเนอร์จะแสดงตรงนี้ (เฉพาะช่วงเทศกาล) -->
            <div data-lk-banner style="--accent:#5a9b00;--accent-text:#fff"></div>

            <form id="login-form" class="space-y-4 p-8" novalidate>
                <div>
                    <label for="email" class="block text-sm font-semibold text-slate-700 mb-1">อีเมล</label>
                    <input type="email" id="email" autocomplete="email" required
                        class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-bc-500 focus:border-bc-500">
                </div>

                <div>
                    <label for="password" class="block text-sm font-semibold text-slate-700 mb-1">รหัสผ่าน</label>
                    <div class="relative">
                        <input type="password" id="password" autocomplete="current-password" required
                            class="w-full px-3 py-2 pr-16 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-bc-500 focus:border-bc-500">
                        <button type="button" id="toggle-password"
                            class="absolute inset-y-0 right-0 px-3 text-sm text-slate-500 hover:text-bc-700">แสดง</button>
                    </div>
                </div>

                <div id="message" class="hidden text-sm rounded-lg px-3 py-2" role="alert"></div>

                <button type="submit" id="submit-btn"
                    class="w-full bg-bc-500 text-white font-bold py-2.5 rounded-lg hover:bg-bc-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-bc-500 transition disabled:opacity-60 disabled:cursor-not-allowed">
                    เข้าสู่ระบบ
                </button>

                <button type="button" id="reset-btn" class="w-full text-sm text-bc-700 hover:underline">
                    ลืมรหัสผ่าน?
                </button>
                <p class="text-xs text-gray-500 text-center">ระบบภายในทีม มีการบันทึกการใช้งาน (อีเมล หน้า เวลา ชนิดเครื่อง)</p>
            </form>
        </main>

        <!-- ฝั่งราคาน้ำมัน (iframe จากบางจาก กว้าง 320 ตามต้นฉบับ) -->
        <aside class="w-full max-w-sm lg:w-auto lg:max-w-none bg-white rounded-2xl shadow-lg p-4 flex flex-col items-center"
               aria-label="ราคาน้ำมันวันนี้">
            <iframe
                title="ราคาน้ำมันบางจากวันนี้"
                width="320" height="680"
                src="https://oil-price.bangchak.co.th/BcpOilPrice1/th"
                frameborder="0" scrolling="no" loading="lazy"
                class="max-w-full"></iframe>
        </aside>
    </div>

    <!-- เรียกใช้งานไฟล์ JavaScript ที่แยกออกมา -->
    <script type="module" src="./auth.js?v=20261122-cut"></script>
    <!-- พื้นหลังแถบเส้นใยจุดบิดพลิ้ว -->
    <script src="./ghost-fibers.js?v=3" defer></script>
    <!-- ลูกเล่นเทศกาลลอยกระทง (ชั่วคราว เปิด/ปิดเองตามวันที่ในไฟล์) -->
    <script src="./festival-loykrathong.js" defer></script>
    <script src="./festival-atm.js" defer></script>
    <script src="./festival-ghostrun.js" defer></script>
    <script src="./festival-bts.js" defer></script>
    <script src="./festival-fathersday.js" defer></script>
    <script src="./festival-christmas.js" defer></script>
    <script src="./festival-bangsaen21.js" defer></script>
    <script src="./festival-newyear.js" defer></script>
</body>
</html>
