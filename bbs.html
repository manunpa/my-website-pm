<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="stylesheet" href="./pwa.css">
<script src="./pwa.js" defer></script>
<!-- ซ่อนหน้าไว้จนกว่า Firebase จะยืนยันตัวตนเสร็จ (firebase-guard.js จะใส่คลาส .ready) -->
<style>html:not(.ready) body { visibility: hidden; }</style>
<!-- โทนมืด/สว่างใช้ค่าเดียวกับหน้าหลัก (hub-theme) ตั้งก่อนวาดหน้าเพื่อไม่ให้กระพริบ -->
<script>try { if (localStorage.getItem('hub-theme') === 'dark') document.documentElement.dataset.theme = 'dark'; } catch (e) {}</script>
<title>บันทึก BBS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{--head:#e6ecf3;--bg:#f5f5f3;--panel:#fff;--line:#dcdcd7;--ink:#1a1a1a;--mute:#6f6f6a;--ok:#1b7f4c;--no:#c0362c}
:root[data-theme=dark]{--head:#2a313a;--bg:#161616;--panel:#1f1f1f;--line:#333;--ink:#ececea;--mute:#9a9a95;--ok:#4cc38a;--no:#ff6b5e;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Thai',system-ui,sans-serif;font-size:15px;line-height:1.5;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.wrap{max-width:900px;margin:0 auto;padding:16px}
header{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:12px}
h1{font-size:20px;margin:0}h3{font-size:13px;margin:14px 0 6px;color:var(--mute)}
input,select,button{font:inherit;color:var(--ink)}
input,select{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-width:0}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn:disabled{opacity:.45;cursor:default}
.panel,.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px}
.line{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.grow{flex:1 1 200px}
label{font-size:13px;color:var(--mute)}
[hidden]{display:none !important}
.mute{color:var(--mute);font-size:13px}
.bad{color:var(--no)}
h2{font-size:15px;margin:0 0 8px;display:flex;gap:8px;align-items:center}
h2 b{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--bg);font-size:13px}
h2 small{font-weight:400;color:var(--mute)}
section p{margin:0 0 8px}
.field{display:flex;flex-direction:column;gap:3px}
.field input,.field select{color:var(--ink);font-size:15px}
#pick-file label{cursor:pointer;color:var(--ink)}
.state{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border:2px solid var(--ink);border-radius:10px;padding:12px;margin-bottom:10px;background:var(--panel);font-weight:600}
.state.bad{border-color:var(--no)}
.spin{width:18px;height:18px;flex:none;border-radius:50%;border:3px solid var(--line);border-top-color:var(--ink);animation:spin .8s linear infinite}
.state.bad .spin{display:none}
@keyframes spin{to{transform:rotate(360deg)}}
.finish{position:sticky;bottom:0;z-index:2;display:flex;gap:14px;align-items:center;justify-content:space-between;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px 10px 18px;box-shadow:0 -4px 14px rgba(0,0,0,.07)}
.finish .btn{margin-left:auto;flex:none;padding:9px 16px}
.card{background:var(--bg)}
#setup>summary{cursor:pointer;display:flex;justify-content:space-between;gap:8px}
#setup[open]>summary{margin-bottom:10px}
.row,.entry{display:block;width:100%;text-align:left;background:var(--panel);cursor:pointer;padding:0}
.row{border:1px solid var(--line);border-radius:10px;margin-bottom:14px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.row:hover{border-color:var(--ink)}
.row.none{border-left:6px solid var(--no)}
.entry{border:0;border-bottom:1px solid var(--line)}
.car{display:flex;gap:10px;flex-wrap:wrap;align-items:baseline;background:var(--head);padding:8px 12px}
.car b{font-size:17px}
.who{flex:1}
.tally{font-size:13px;color:var(--mute)}
.row.none .tally{color:var(--no);font-weight:600}
.dest{display:flex;gap:12px;padding:7px 12px;font-size:14px}
.dest .label{color:var(--mute);flex:none;width:40px}
.names{display:flex;flex-direction:column;min-width:0;overflow-wrap:anywhere}
.logs{display:block;border-top:1px solid var(--line)}
.log{display:grid;grid-template-columns:160px minmax(0,1fr) 110px;gap:12px;padding:6px 12px;font-size:14px;align-items:start}
.logs .log:nth-child(even){background:var(--bg)}
.stamp{font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:600}
.place{overflow-wrap:anywhere}
.place i{color:var(--mute);font-style:normal}
.place small{display:block;color:var(--mute);font-size:13px}
.kind{color:var(--mute);text-align:right;font-size:13px}
.kind em{display:block;font-style:normal;color:var(--no);font-weight:600}
@media(max-width:560px){
  .log{grid-template-columns:minmax(0,1fr) auto;gap:2px 10px}
  .log .place{grid-column:1/-1;order:3}
}
.vehicle .dest{border:1px solid var(--line);border-radius:8px;margin-bottom:10px}
.zone{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;border:2px dashed var(--line);border-radius:12px;padding:20px 12px;cursor:pointer}
.zone b{color:var(--ink);font-size:15px}
.zone.over,.zone:hover{border-color:var(--ink);background:var(--bg)}
.shot{border-top:1px solid var(--line);padding-top:8px}
.shot .line{margin-bottom:6px}
.shot em{font-style:normal;color:#b07400;font-size:13px}
.theme{width:38px;height:38px;flex:none;border-radius:50%;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;cursor:pointer;padding:0}
.theme:hover{border-color:var(--mute)}
.theme svg{width:18px;height:18px}
.theme .sun{display:none}
:root[data-theme=dark] .theme .sun{display:block}
:root[data-theme=dark] .theme .moon{display:none}
.ico{width:17px;height:17px;vertical-align:-3px;margin-right:6px}
.vehicle h3.title{font-size:18px;color:var(--ink);margin:12px 0 8px}
body.detail #setup,body.detail .tools{display:none}
.btn.wide{width:100%;padding:10px}
.editor{border:2px solid var(--ink);border-radius:10px;padding:10px;margin-top:10px;background:var(--panel)}
.info>summary{color:var(--mute);margin-bottom:6px}
.empty{text-align:center;color:var(--mute);border:1px dashed var(--line);border-radius:10px;padding:16px}
.save-state{display:flex;gap:10px;align-items:center;min-width:0}
.save-state b{display:block;font-size:14px;font-weight:600;line-height:1.3}
.save-state small{display:block;font-size:12.5px;color:var(--mute);line-height:1.4;overflow-wrap:anywhere}
.dot{width:9px;height:9px;flex:none;border-radius:50%;background:var(--ok);box-shadow:0 0 0 4px color-mix(in srgb,var(--ok) 16%,transparent)}
.save-state.wait .dot{background:#c98a00;box-shadow:0 0 0 4px rgba(201,138,0,.16);animation:pulse 1.4s ease-in-out infinite}
.save-state.bad .dot{background:var(--no);box-shadow:0 0 0 4px color-mix(in srgb,var(--no) 16%,transparent)}
.save-state.bad b{color:var(--no)}
@keyframes pulse{50%{opacity:.35}}
@media(prefers-reduced-motion:reduce){.save-state.wait .dot{animation:none}}
.card>summary::before{content:"▸";color:var(--mute)}
.card[open]>summary::before{content:"▾"}
.body{margin-top:12px}
.round{border-left:3px solid var(--line);padding-left:10px;margin-bottom:12px}
.note{width:100%;margin-top:6px}
.checks{display:flex;flex-direction:column;gap:4px;margin-top:6px}
details>.line{margin:6px 0 0}
.chk{text-align:left;background:transparent;border:1px solid var(--line);border-radius:6px;padding:5px 8px;font-size:13px;cursor:pointer}
.chk.ok{border-color:var(--ok);color:var(--ok)}
.chk.no{border-color:var(--no);color:var(--no);font-weight:600}
summary{cursor:pointer}
dialog{width:min(640px,94vw);max-height:85vh;overflow:auto;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:16px}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog ul{padding-left:18px;margin:0 0 12px}
dialog em{font-style:normal;color:var(--no)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>บันทึกพฤติกรรม พขร. (BBS)</h1>
    <div class="line" style="margin:0">
      <button class="theme" id="theme" type="button" aria-label="สลับโทนมืด/สว่าง" title="สลับโทนมืด/สว่าง">
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
      <a class="btn" href="./Access-Hub.html">หน้าหลัก</a>
      <button class="btn" id="logout-btn" type="button">ออกจากระบบ</button>
    </div>
  </header>

  <details class="panel" id="setup">
    <summary><b id="setup-title">เลือกหน่วยงาน วันที่ และกะ</b><span class="mute">เปลี่ยน</span></summary>
    <div class="line">
      <label class="field grow">หน่วยงาน (ฟอร์ม)
        <select id="form" aria-label="ฟอร์ม" hidden></select>
        <span class="btn" id="pick-file"><label for="template">เลือกไฟล์ฟอร์มต้นแบบ (.xlsx)</label></span>
      </label>
      <label class="field">วันที่<input type="date" id="date"></label>
      <label class="field">กะ<select id="shift"><option value="day">กลางวัน 08–20 น.</option><option value="night">กลางคืน 20–08 น.</option></select></label>
    </div>
    <input type="file" id="template" accept=".xlsx" hidden>
    <span class="mute" id="template-name" hidden></span>
    <div class="line" style="margin:0">
      <label class="field grow">ตรวจสอบโดย<input id="checker" placeholder="ชื่อผู้ตรวจสอบ"></label>
      <label class="field grow">Monitor<input id="monitor" placeholder="ชื่อ Monitor"></label>
    </div>
  </details>

  <div class="state" id="state" role="status" hidden>
    <span class="spin" aria-hidden="true"></span>
    <span id="state-text"></span>
    <button class="btn" id="retry" type="button" hidden>ลองใหม่</button>
  </div>

  <section class="panel">
    <div class="line tools">
      <input id="search" class="grow" type="search" placeholder="ค้นหารถ / ชื่อ" aria-label="ค้นหา" disabled>
      <button class="btn" id="plan-button" type="button" title="ดึงเฉพาะวันที่และกะที่เลือก" disabled><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></svg>แผนงาน</button>
      <input type="file" id="plan" accept=".xlsx" multiple hidden>
      <button class="btn" id="shot-button" type="button" title="อ่านเวลาและสถานที่จากรูป" disabled><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.5"/></svg>รูป</button>
      <button class="btn" id="add" type="button" disabled>+ รถ</button>
    </div>
    <p class="mute tools" id="count"></p>
    <div id="list"></div>
    <p class="tools"><label><input type="checkbox" id="show-all"> แสดงรถที่ไม่มีงาน (<span id="hidden-count">0</span>)</label></p>
  </section>

  <section class="finish">
    <div class="save-state" id="status" role="status" hidden>
      <span class="dot" aria-hidden="true"></span>
      <span><b id="status-title"></b><small id="status-detail"></small></span>
    </div>
    <button class="btn primary" id="export" type="button" disabled>ส่งออกรายงาน Excel</button>
  </section>

  <dialog id="shot-dialog" aria-labelledby="shot-title">
    <h3 id="shot-title">ลงเวลาจากรูป</h3>
    <label class="zone" id="shot-zone" for="shot-file">
      <b>แตะเพื่อเลือกรูป</b>
      <span>หรือกด Ctrl+V เพื่อวางรูปที่คัดลอกไว้ หรือลากรูปมาใส่ (หลายรูปได้)</span>
    </label>
    <input type="file" id="shot-file" accept="image/*" multiple hidden>
    <p><button class="btn" id="shot-paste" type="button"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4h6v3H9z"/><path d="M9 5H6a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1h-3"/></svg>วางรูปที่คัดลอกไว้</button></p>
    <p id="shot-state" role="status"></p>
    <div id="shot-list"></div>
    <div class="line" style="margin:0">
      <button class="btn primary" id="shot-ok" type="button" disabled>เพิ่ม 0 รอบ</button>
      <button class="btn" id="shot-cancel" type="button">ปิด</button>
    </div>
  </dialog>
  <dialog id="add-dialog" aria-labelledby="add-title">
    <form id="add-form">
      <h3 id="add-title">เพิ่มรถ / งาน</h3>
      <div class="line">
        <label class="field grow">เบอร์รถ (เลือกจากรายการ หรือพิมพ์ใหม่)<input id="add-scc" list="add-list" autocomplete="off" required></label>
        <datalist id="add-list"></datalist>
        <label class="field grow">ทะเบียน (เฉพาะรถใหม่)<input id="add-plate" autocomplete="off"></label>
      </div>
      <div class="line" style="margin:0">
        <button class="btn primary" type="submit">เพิ่ม</button>
        <button class="btn" id="add-cancel" type="button">ยกเลิก</button>
      </div>
    </form>
  </dialog>
  <dialog id="plan-dialog" aria-labelledby="plan-title">
    <h3 id="plan-title"></h3>
    <ul id="plan-notes" class="bad"></ul>
    <ul id="plan-list"></ul>
    <div class="line" style="margin:0">
      <button class="btn primary" id="plan-ok" type="button">เติมลงฟอร์ม</button>
      <button class="btn" id="plan-cancel" type="button">ยกเลิก</button>
    </div>
  </dialog>
</div>
<script>
(() => {
  const root = document.documentElement;
  const button = document.getElementById('theme');
  button.addEventListener('click', () => {
    const dark = root.dataset.theme !== 'dark';
    if (dark) root.dataset.theme = 'dark'; else delete root.dataset.theme;
    try { localStorage.setItem('hub-theme', dark ? 'dark' : 'light'); } catch (e) {}
  });
})();
</script>
<script type="module" src="./bbs.js?v=18"></script>
</body>
</html>
