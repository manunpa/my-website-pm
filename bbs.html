<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="stylesheet" href="./pwa.css">
<script src="./pwa.js" defer></script>
<!-- ซ่อนหน้าไว้จนกว่า Firebase จะยืนยันตัวตนเสร็จ (firebase-guard.js จะใส่คลาส .ready) -->
<style>html:not(.ready) body { visibility: hidden; }</style>
<title>บันทึก BBS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Sarabun:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{--bg:#f5f5f3;--panel:#fff;--line:#dcdcd7;--ink:#1a1a1a;--mute:#6f6f6a;--no:#c0362c}
@media (prefers-color-scheme:dark){:root{--bg:#161616;--panel:#1f1f1f;--line:#333;--ink:#ececea;--mute:#9a9a95;--no:#ff6b5e;color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none !important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Thai',system-ui,sans-serif;font-size:14px;line-height:1.5;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.page{display:flex;flex-direction:column;height:100vh;height:100dvh;padding:8px;gap:6px}
h1{font-size:16px;margin:0}
.line{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.line>.grow{flex:1 1 130px;max-width:220px}
.bar input,.bar select,.btn{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 9px;min-width:0}
.btn{cursor:pointer;text-decoration:none}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn:disabled{opacity:.4;cursor:default}
.push{margin-left:auto}
label{font-size:13px;color:var(--mute)}
.mute{color:var(--mute);font-size:13px}
.bad{color:var(--no)}
#status{margin:0;min-height:1.4em}
#setup{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:24px;text-align:center}
#work{display:flex;flex-direction:column;gap:6px;flex:1;min-height:0}

/* ตัวฟอร์ม: พื้นขาวเหมือนใน Excel เสมอ */
#sheet{flex:1;min-height:200px;overflow:auto;background:#fff;color:#000;border:1px solid var(--line);color-scheme:light}
.sheet{position:relative;width:max-content;zoom:var(--zoom,.7);font-family:'Sarabun','TH Sarabun New',Tahoma,sans-serif;line-height:1.25}
.sheet table{table-layout:fixed;border-collapse:collapse}
.sheet td{border:1px solid #e3e3e3;padding:0;overflow:visible;height:inherit}
.sheet img{position:absolute;pointer-events:none;z-index:2}
.flow{white-space:pre;padding:0 3px}
.wrap-text{white-space:pre-wrap;overflow:hidden;overflow-wrap:anywhere;padding:0 2px}
.sheet td input,.sheet td button{display:block;width:100%;height:100%;min-height:26px;border:0;margin:0;padding:0 3px;background:transparent;
  font:inherit;color:inherit;font-weight:inherit;text-align:inherit}
.sheet td button{cursor:pointer;text-align:center;padding:0}
.sheet td button.bad{color:#c00;font-weight:700}
.sheet td input:focus,.sheet td button:focus-visible{outline:2px solid #1a73e8;outline-offset:-2px;background:#fff}
.sheet td button:hover{background:rgba(255,255,255,.55)}
.sheet tr.picked td{box-shadow:inset 0 2px 0 #1a73e8,inset 0 -2px 0 #1a73e8}
/* หัวคอลัมน์และลำดับ/เบอร์รถ ค้างไว้ตอนเลื่อน */
@media (min-width:800px) and (min-height:700px){
  .sheet tr.titles td{position:sticky;top:0;z-index:3}
  .sheet tr.titles td:not([style*="background"]){background:#fff}
}
.sheet td.fix1,.sheet td.fix2{position:sticky;left:0;z-index:1}
.sheet td.fix2{left:57px}
.sheet td.fix1:not([style*="background"]),.sheet td.fix2:not([style*="background"]){background:#fff}
.sheet tr.titles td.fix1,.sheet tr.titles td.fix2{z-index:4}
</style>
</head>
<body>
<div class="page">
  <div class="line bar">
    <h1>บันทึก BBS</h1>
    <input type="date" id="date" aria-label="วันที่รายงาน">
    <select id="shift" aria-label="กะ"><option value="day">กะกลางวัน</option><option value="night">กะกลางคืน</option></select>
    <input id="checker" class="grow" placeholder="ตรวจสอบโดย" aria-label="ตรวจสอบโดย">
    <input id="monitor" class="grow" placeholder="Monitor" aria-label="Monitor">
    <label class="btn push" id="change-template" for="template" hidden>เปลี่ยนฟอร์ม</label>
    <input type="file" id="template" accept=".xlsx" hidden>
    <a class="btn" href="./Access-Hub.html">หน้าหลัก</a>
    <button class="btn" id="logout-btn" type="button">ออกจากระบบ</button>
  </div>
  <p class="mute" id="status" role="status"></p>

  <div id="setup" hidden>
    <p>ตั้งค่าครั้งแรก: เลือกไฟล์ฟอร์มต้นแบบ แล้วระบบจะจำไว้</p>
    <label class="btn primary" for="template">เลือกไฟล์ฟอร์ม (.xlsx)</label>
  </div>

  <div id="work" hidden>
    <div class="line bar">
      <input id="search" class="grow" type="search" placeholder="ค้นหารถ / ชื่อ" aria-label="ค้นหา">
      <span class="mute" id="picked-name">แตะช่องในแถวก่อน</span>
      <button class="btn" type="button" data-preset="driving" data-needs-row disabled>✓ ขับรถ</button>
      <button class="btn" type="button" data-preset="loading" data-needs-row disabled>✓ รับน้ำมัน</button>
      <button class="btn" type="button" data-preset="unloading" data-needs-row disabled>✓ ลงน้ำมัน</button>
      <button class="btn" id="add-row" type="button" data-needs-row disabled>+ แถว</button>
      <button class="btn" id="add" type="button">+ รถ</button>
      <label><input type="checkbox" id="show-loading"> ช่องรับน้ำมัน</label>
      <select id="zoom" aria-label="ขนาด">
        <option value="0.5">50%</option><option value="0.6">60%</option><option value="0.7" selected>70%</option>
        <option value="0.85">85%</option><option value="1">100%</option>
      </select>
      <button class="btn primary push" id="export" type="button">ส่งออก Excel</button>
    </div>
    <div id="sheet"></div>
  </div>
</div>
<script type="module" src="./bbs.js?v=2"></script>
</body>
</html>
