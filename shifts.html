<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<style>html:not(.allowed) body{visibility:hidden}</style>
<title>ตารางวันทำงาน</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns=%27http://www.w3.org/2000/svg%27%20viewBox=%270%200%2032%2032%27%3E%3Cdefs%3E%3ClinearGradient%20id=%27g%27%20x1=%270%27%20y1=%270%27%20x2=%271%27%20y2=%271%27%3E%3Cstop%20offset=%270%27%20stop-color=%27%23f43f5e%27/%3E%3Cstop%20offset=%271%27%20stop-color=%27%23be185d%27/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect%20width=%2732%27%20height=%2732%27%20rx=%278%27%20fill=%27url%28%23g%29%27/%3E%3Crect%20x=%277%27%20y=%279%27%20width=%2718%27%20height=%2717%27%20rx=%273%27%20fill=%27none%27%20stroke=%27white%27%20stroke-width=%272.4%27%20stroke-linecap=%27round%27%20stroke-linejoin=%27round%27/%3E%3Cpath%20d=%27M7%2015h18M12%206v5M20%206v5%27%20fill=%27none%27%20stroke=%27white%27%20stroke-width=%272.4%27%20stroke-linecap=%27round%27%20stroke-linejoin=%27round%27/%3E%3Cpath%20d=%27M12%2020.500h.01M16%2020.500h.01M20%2020.500h.01%27%20fill=%27none%27%20stroke=%27white%27%20stroke-width=%272.4%27%20stroke-linecap=%27round%27%20stroke-linejoin=%27round%27/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f5f3;--panel:#fff;--line:#e4e4e8;--ink:#33363d;--mute:#6b7080;
  /* สีกะโทนพาสเทล: พื้น / ตัวหนังสือ */
  --D:#fff1c2;--Dt:#7a5a00;--N:#dce8fb;--Nt:#274b8a;--DO:#fbd5d5;--DOt:#b42318;
  --AL:#d8f0df;--ALt:#1f6b3a;--V:#e9e0fa;--Vt:#563a9c;--L:#fde1d3;--Lt:#9a4a22}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 'IBM Plex Sans Thai',system-ui,sans-serif;padding:16px}
header,.line{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
header{justify-content:space-between}
h1{font-size:20px;margin:0}
.btn{font:inherit;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer}
.mute{color:var(--mute);font-size:13px}
.scroll{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px}
table{border-collapse:separate;border-spacing:0;font-size:12px;text-align:center;white-space:nowrap;min-width:100%}
th,td{border:1px solid var(--panel);border-radius:5px;padding:1px 4px;line-height:1.25;min-width:30px;background:var(--panel)}
thead th{position:sticky;top:0;background:var(--panel);color:var(--mute);font-weight:500;z-index:2}
thead tr+tr th{top:19px;font-weight:400}
.name{position:sticky;left:0;z-index:1;text-align:left;min-width:170px}
thead .name{z-index:3}
thead th.we{color:#d0605e}
td.D,.chip.D,.key .D{background:var(--D);color:var(--Dt)}
td.N,.chip.N,.key .N{background:var(--N);color:var(--Nt)}
td.DO,.chip.DO,.key .DO{background:var(--DO);color:var(--DOt)}
td.AL,.chip.AL,.key .AL{background:var(--AL);color:var(--ALt)}
td.V,.chip.V,.key .V{background:var(--V);color:var(--Vt)}
td.L,.chip.L,.key .L{background:var(--L);color:var(--Lt)}
td.off{background:#d6d6dc}
td.chg{box-shadow:inset 0 0 0 2px #e5484d;font-weight:600;cursor:pointer}
#t{cursor:crosshair;user-select:none}
#t .x{background-image:linear-gradient(rgba(59,130,246,.13),rgba(59,130,246,.13))}
#t .lk{background-image:linear-gradient(rgba(245,158,11,.22),rgba(245,158,11,.22))}
#t .at{outline:2px solid #2563eb;outline-offset:-2px;font-weight:600}
tr.sum td{font-weight:500;color:var(--mute)}
.key span{padding:1px 11px;border-radius:999px;font-size:12px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin-top:10px}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.stats div{background:var(--bg);border-radius:8px;padding:6px 14px;min-width:110px}
.stats b{display:block;font-size:20px;font-weight:600}
.round{margin-top:14px;font-weight:600}
.log{margin-top:4px;text-align:left;min-width:0;border-top:1px solid var(--line);border-left:1px solid var(--line)}
.log th,.log td{padding:4px 10px;text-align:left;border-width:0 1px 1px 0;border-style:solid;border-color:var(--line);border-radius:0}
.log th{background:var(--bg);font-weight:500}
.log .chip{display:inline-block;min-width:32px;text-align:center;border-radius:6px;padding:0 6px}
.low{color:#b3261e;font-weight:600}
.top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.boxes{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.box{border-radius:10px;padding:8px 12px}
.box b{display:block;font-size:24px;font-weight:600;line-height:1.2}
.box b small{font-size:12px;font-weight:400;margin-left:6px}
.who{display:inline-block;background:rgba(255,255,255,.75);color:var(--ink);border-radius:999px;padding:0 9px;font-size:12px;margin:3px 3px 0 0}
.box.D{background:var(--D);color:var(--Dt)}.box.N{background:var(--N);color:var(--Nt)}.box.DO{background:var(--DO);color:var(--DOt)}.box.L{background:var(--L);color:var(--Lt)}
.up{color:#1f6b3a}
.tabs button{font:inherit;background:var(--panel);border:1px solid var(--line);padding:3px 14px;cursor:pointer;color:var(--mute)}
.tabs button:first-child{border-radius:999px 0 0 999px}.tabs button:last-child{border-radius:0 999px 999px 0}
.tabs button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.step{padding:1px 12px}
</style>
</head>
<body>
<header>
  <div><h1>ตารางวันทำงาน</h1><div id="title"></div></div>
  <div class="line">
    <a class="btn" href="Access-Hub.html" style="color:inherit;text-decoration:none">กลับหน้าหลัก</a>
    <select id="month" class="btn" hidden></select>
    <input id="q" class="btn" placeholder="ค้นหาชื่อ / กลุ่ม">
  </div>
</header>
<div id="note" class="mute line"></div>
<div class="scroll"><table id="t"></table></div>
<div id="info" class="line" style="min-height:22px;margin-top:8px"></div>
<div class="line key">
  <span class="D">D เช้า</span><span class="N">N ดึก</span><span class="DO">DO หยุด</span>
  <span class="AL">AL นักขัตฤกษ์</span><span class="V">พร พักร้อน</span><span class="L">ป / ก / ข ลา-ขาด</span>
</div>
<div class="panel" id="tomorrow" hidden></div>
<div class="panel"><b>สรุปการเปลี่ยนแปลง</b><div id="log"></div></div>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const CLS = { D: 'D', N: 'N', DO: 'DO', AL: 'AL', 'พร': 'V', 'ป': 'L', 'ก': 'L', 'ข': 'L' };

// ตารางมาจาก shift-sync/sync.ps1 → apps-script/shifts.gs หน้านี้ดูอย่างเดียว
let data = { title: 'กำลัง Pull จาก Server…', days: [], week: [], people: [] };
let rounds = []; // ใหม่สุดอยู่บน
let changes = [];

const dayLabel = (i) => `${data.week[i]} ${data.days[i]}`;
// ไฟล์มีคอลัมน์วันของเดือนก่อน (มักถูกซ่อนไว้ใน Excel) หน้าเว็บแสดงตั้งแต่วันที่ 1 เท่านั้น
const monthStart = () => Math.max(0, data.days.indexOf(1));
const inMonth = (i) => i === undefined || i >= monthStart();
let shownRounds = [];
const WEEKDAYS = ['อา', 'จ', 'อ', 'พ', 'พฤ', 'ศ', 'ส'];
// คอลัมน์ยึดตามปฏิทินของเดือนที่เลือก (m2569-11 = 30 วัน) วันที่ไฟล์ไม่มีจะเป็นช่องว่าง (i = -1)
function columns() {
  const from = monthStart();
  const key = $('month').value.match(/^m(\d{4})-(\d\d)$/);
  if (!key) return data.days.slice(from).map((d, n) => ({ d, i: n + from, w: data.week[n + from] }));
  const year = key[1] - 543;
  const month = key[2] - 1;
  return Array.from({ length: new Date(year, month + 1, 0).getDate() }, (_, n) => ({
    d: n + 1, i: data.days.indexOf(n + 1, from), w: WEEKDAYS[new Date(year, month, n + 1).getDay()],
  }));
}
const chip = (c) => `<span class="chip ${CLS[c] || ''}">${esc(c)}</span>`;
const delta = ([a, b]) => (a === b ? String(b) : `<span class="${b < a ? 'low' : ''}">${a} → ${b}</span>`);

const stamp = (t) => new Date(t).toLocaleString('th-TH', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });

function renderLog() {
  if (!shownRounds.length) { $('log').innerHTML = '<div class="mute">ยังไม่มีการเปลี่ยนแปลง</div>'; return; }
  const stats = [[shownRounds.length, 'ครั้งที่แก้'], [changes.length, 'รายการที่เปลี่ยน'], [new Set(changes.map((c) => c.id)).size, 'คนที่โดนเปลี่ยน'], [new Set(changes.filter((c) => c.i !== undefined).map((c) => c.i)).size, 'วันที่กระทบ']];
  let html = '<div class="stats">' + stats.map(([v, t]) => `<div><b>${v}</b>${t}</div>`).join('') + '</div>';
  for (const r of shownRounds) {
    html += `<div class="round">แก้เมื่อ ${esc(typeof r.when === 'number' ? stamp(r.when) : r.when)} · ${r.list.length} รายการ</div>`;
    html += '<div style="display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start;overflow:auto">';
    html += '<table class="log"><tr><th>ชื่อ</th><th>วันที่</th><th>เดิม → ใหม่</th></tr>' + r.list.map((c) => `<tr><td>${esc(c.name)}</td>` + (c.i === undefined ? `<td colspan="2">${esc(c.text)}</td>` : `<td>${esc(dayLabel(c.i))}</td><td>${chip(c.from)} → ${chip(c.to)}</td>`) + '</tr>').join('') + '</table>';
    // กำลังคน: แสดงเฉพาะกะและวันที่ตัวเลขเปลี่ยน กะที่ไม่เกี่ยวไม่ต้องขึ้น
    const moved = ([a, b]) => a !== b;
    const hit = r.impact.filter((x) => moved(x.d) || moved(x.n));
    const shifts = [['d', 'เช้า'], ['n', 'ดึก']].filter(([k]) => hit.some((x) => moved(x[k])));
    if (hit.length) html += '<table class="log"><tr><th>กำลังคนวันที่</th>' + shifts.map(([, t]) => `<th>${t}</th>`).join('') + '</tr>' + hit.map((x) => `<tr><td>${esc(dayLabel(x.i))}</td>` + shifts.map(([k]) => `<td>${moved(x[k]) ? delta(x[k]) : ''}</td>`).join('') + '</tr>').join('') + '</table>';
    html += '</div>';
  }
  $('log').innerHTML = html;
}

// เส้นเล็ง: ชี้เมาส์ = แถบฟ้า, กด = ค้างแถบส้ม กดช่องเดิมอีกครั้งเพื่อยกเลิก
let lock = null;
let hover = null;
function paint() {
  [...$('t').rows].forEach((row, y) => [...row.cells].forEach((cell, x) => {
    cell.classList.toggle('x', !!hover && (hover.x === x || hover.y === y));
    cell.classList.toggle('lk', !!lock && (lock.x === x || lock.y === y));
    cell.classList.toggle('at', !!lock && lock.x === x && lock.y === y);
  }));
}
const spot = (e) => {
  const cell = e.target.closest('td,th');
  return cell ? { x: cell.cellIndex, y: cell.parentNode.rowIndex } : null;
};

// ===== สรุปเมื่อวาน / วันนี้ / พรุ่งนี้ (พรุ่งนี้เทียบกับวันนี้) (ตามปฏิทินจริง ไม่ขึ้นกับเดือนที่เลือกดู) =====
const GROUPS = [['D', 'เข้าเช้า'], ['N', 'เข้าดึก'], ['DO', 'หยุด (DO)'], ['L', 'ลา / พักร้อน']];
const groupOf = (code) => (!code ? '' : code === 'D' || code === 'N' || code === 'DO' ? code : 'L');
const shortName = (name) => name.replace(/^(นางสาว|นาย|นาง|น\.ส\.|นส\.)\s*/, '').split(/\s+/)[0];
const monthKey = (date) => `m${date.getFullYear() + 543}-${String(date.getMonth() + 1).padStart(2, '0')}`;

// รหัสกะของแต่ละคนในวันนั้น: id -> { name, code } คนที่ช่องว่าง (ออก/ฝึกงานจบ) ไม่นับ
// หัวหน้า (กลุ่ม HOD ในไฟล์) ยังอยู่ในตาราง แต่ไม่นับเป็นกำลังพล
const counted = (p) => p.group.trim().toUpperCase() !== 'HOD';

function dayCodes(month, date) {
  const out = new Map();
  if (!month) return out;
  const i = month.days.indexOf(date.getDate(), Math.max(0, month.days.indexOf(1)));
  if (i < 0) return out;
  for (const p of month.people.filter(counted)) if (p.codes[i]) out.set(p.id, { name: p.name, code: p.codes[i] });
  return out;
}

// months = { m2569-11: ตาราง, ... }
let dayData = {};
let dayNow = new Date();
let dayTab = 0; // จำนวนวันนับจากวันนี้: -1 = เมื่อวาน, 0 = วันนี้, 1 = พรุ่งนี้ (กดลูกศรเลื่อนไปวันอื่นได้)
let fetchMonth = async () => {}; // ส่วนที่ล็อกอินแล้วใส่ตัวโหลดจริงให้
function renderTomorrow(months = dayData, now = dayNow) {
  dayData = months;
  dayNow = now;
  const dayAt = (n) => new Date(now.getFullYear(), now.getMonth(), now.getDate() + n);
  const a = dayCodes(months[monthKey(now)], now);
  const day = dayAt(dayTab);
  const picked = dayCodes(months[monthKey(day)], day);
  const [shown, base] = [picked, dayTab === 1 ? a : new Map()]; // เทียบเฉพาะพรุ่งนี้กับวันนี้
  const when = day.toLocaleDateString('th-TH', { weekday: 'long', day: 'numeric', month: 'short' });
  const box = $('tomorrow');
  box.hidden = false;
  const head = `<div class="top"><div class="tabs">${['เมื่อวาน', 'วันนี้', 'พรุ่งนี้'].map((t, n) => `<button type="button" data-day="${n - 1}" aria-pressed="${n - 1 === dayTab}">${t}</button>`).join('')}</div><div><button type="button" class="btn step" data-day="${dayTab - 1}" aria-label="วันก่อนหน้า">‹</button> <b>${esc(when)}</b> <button type="button" class="btn step" data-day="${dayTab + 1}" aria-label="วันถัดไป">›</button></div>`;
  if (!shown.size) { box.innerHTML = head + '</div><div class="mute">ยังไม่มีข้อมูลกะของวันที่เลือกในตาราง</div>'; return; }
  const count = (map, group) => [...map.values()].filter((p) => groupOf(p.code) === group).length;
  const diff = (x, y) => (!base.size || x === y ? '' : y > x ? `เพิ่ม ${y - x}` : `ลด ${x - y}`);
  const work = (map) => count(map, 'D') + count(map, 'N');
  let html = head + `<span class="mute">มาทำงาน ${work(shown)} คน`
    + (base.size ? ` (วันนี้ ${work(base)}${work(base) === work(shown) ? '' : ', ' + diff(work(base), work(shown))})` : '') + '</span></div><div class="boxes">';
  for (const [group, title] of GROUPS) {
    const list = [...shown.values()].filter((p) => groupOf(p.code) === group);
    html += `<div class="box ${group}">${title}<b>${list.length}<small>${diff(count(base, group), list.length)}</small></b>`
      + list.map((p) => `<span class="who">${esc(shortName(p.name))}${group === 'L' ? ' · ' + esc(p.code) : ''}</span>`).join('') + '</div>';
  }
  html += '</div>';
  const moved = [...shown].filter(([id, p]) => base.has(id) && groupOf(base.get(id).code) !== groupOf(p.code));
  if (moved.length) {
    const note = (from, to) => {
      const off = (g) => g === 'DO' || g === 'L';
      if (to === 'L') return ['low', 'เริ่มลา'];
      if (to === 'DO') return ['', 'เริ่มหยุด'];
      if (off(from)) return ['up', 'กลับมาทำงาน'];
      return ['', to === 'N' ? 'ย้ายไปกะดึก' : 'ย้ายไปกะเช้า'];
    };
    html += '<div class="round">เปลี่ยนจากวันนี้</div><table class="log"><tr><th>ชื่อ</th><th>วันนี้</th><th>พรุ่งนี้</th><th></th></tr>'
      + moved.map(([id, p]) => {
        const [cls, text] = note(groupOf(base.get(id).code), groupOf(p.code));
        return `<tr><td>${esc(shortName(p.name))}</td><td>${chip(base.get(id).code)}</td><td>${chip(p.code)}</td><td class="${cls}">${text}</td></tr>`;
      }).join('') + '</table>';
  }
  box.innerHTML = html;
}

function render() {
  shownRounds = rounds
    .map((r) => ({ ...r, list: r.list.filter((c) => inMonth(c.i)), impact: r.impact.filter((x) => inMonth(x.i)) }))
    .filter((r) => r.list.length);
  changes = shownRounds.flatMap((r) => r.list);
  const cols = columns();
  const q = $('q').value.trim().toLowerCase();
  const shown = data.people.filter((p) => (p.name + p.group).toLowerCase().includes(q));
  const count = (list, code) => list.filter((c) => c === code).length;
  const we = (w) => (/^(ส|อา)$/.test(w) ? ' class="we"' : '');
  let html = '<thead><tr><th class="name">ชื่อ - สกุล</th><th>กลุ่ม</th>' + cols.map((c) => `<th>${c.d}</th>`).join('') + '<th>D</th><th>N</th><th>DO</th><th>AL</th></tr>';
  html += '<tr><th class="name"></th><th></th>' + cols.map((c) => `<th${we(c.w)}>${esc(c.w)}</th>`).join('') + '<th></th><th></th><th></th><th></th></tr></thead><tbody>';
  for (const p of shown) {
    html += `<tr><td class="name">${esc(p.name)}</td><td>${esc(p.group)}</td>` + cols.map(({ i }) => {
      const c = p.codes[i] || '';
      const k = changes.findIndex((x) => x.id === p.id && x.i === i);
      return `<td class="${CLS[c] || (!c && i >= 0 ? 'off' : '')}${k >= 0 ? ' chg' : ''}"${k >= 0 ? ` data-k="${k}" title="เดิม ${esc(changes[k].from)}"` : ''}>${esc(c)}</td>`;
    }).join('') + ['D', 'N', 'DO', 'AL'].map((c) => `<td>${count(cols.map(({ i }) => p.codes[i]), c)}</td>`).join('') + '</tr>';
  }
  for (const [code, label] of [['D', 'กะเช้า'], ['N', 'กะดึก'], ['DO', 'วันหยุด']]) {
    html += `<tr class="sum"><td class="name">รวม${label}</td><td></td>` + cols.map(({ i }) => `<td>${i < 0 ? '' : count(data.people.filter(counted).map((p) => p.codes[i]), code)}</td>`).join('') + '<td></td><td></td><td></td><td></td></tr>';
  }
  $('t').innerHTML = html + '</tbody>';
  lock = hover = null; // ตารางถูกวาดใหม่ ตำแหน่งเดิมอาจเป็นคนอื่นแล้ว
  $('title').textContent = data.title;
  renderLog();
  $('note').textContent = `กำลังพล ${data.people.filter(counted).length} คน · เปลี่ยน ${changes.length} รายการ (ช่องกรอบแดง กดดูของเดิม)`;
}

$('q').oninput = render;
$('tomorrow').onclick = async (e) => {
  const day = e.target.dataset.day;
  if (day === undefined) return;
  dayTab = Number(day);
  const date = new Date(dayNow.getFullYear(), dayNow.getMonth(), dayNow.getDate() + dayTab);
  try { await fetchMonth(monthKey(date)); }
  catch (err) { $('info').textContent = 'Pull failed: ' + err.message; }
  renderTomorrow();
};
$('t').onmouseover = (e) => { hover = spot(e); paint(); };
$('t').onmouseleave = () => { hover = null; paint(); };
$('t').onclick = (e) => {
  const at = spot(e);

<script type="module">
import { requireLogin, fetchProtectedText, HUB_URL } from "./firebase-guard.js?v=20261122-cut";
import { SHIFTS_URL } from "./owner.js?v=lock1";

const MONTHS = ["มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน", "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"];
const call = async (body) => JSON.parse(await fetchProtectedText(SHIFTS_URL, body));
const label = (key) => `${MONTHS[Number(key.slice(6)) - 1]} ${key.slice(1, 5)}`;

function show(res) {
  data = res.data || { title: "ยังไม่มีตาราง", days: [], week: [], people: [] };
  rounds = res.rounds;
  render();
  $("info").textContent = res.version ? "Synced ล่าสุด " + stamp(res.version) : "";
}

function fillMonths(keys, selected) {
  $("month").innerHTML = keys.map((k) => `<option value="${esc(k)}">${esc(label(k))}</option>`).join("");
  $("month").value = selected;
  $("month").hidden = !keys.length;
}

// โหลดตารางของเมื่อวาน วันนี้ และพรุ่งนี้ (ต้น/สิ้นเดือนจะเป็นคนละเดือน)
async function loadTomorrow(available) {
  const now = new Date();
  // เลื่อนไปเดือนที่ยังไม่ได้โหลดค่อยดึงมา
  fetchMonth = async (key) => {
    if (!dayData[key] && available.includes(key)) dayData[key] = (await call({ action: "get", key })).data;
  };
  const dates = [-1, 0, 1].map((n) => new Date(now.getFullYear(), now.getMonth(), now.getDate() + n));
  const months = {};
  try {
    for (const key of new Set(dates.map(monthKey))) {
      if (available.includes(key)) months[key] = (await call({ action: "get", key })).data;
    }
    renderTomorrow(months, now);
  } catch (e) {
    $("tomorrow").hidden = false;
    $("tomorrow").textContent = "Pull สรุปกำลังพลไม่สำเร็จ: " + e.message;
  }
}

async function start() {
  try {
    const { months } = await call({ action: "months" });
    // เปิดเดือนปัจจุบันก่อน ไม่มีก็เดือนล่าสุด
    const now = new Date();
    const today = `m${now.getFullYear() + 543}-${String(now.getMonth() + 1).padStart(2, "0")}`;
    const key = months.includes(today) ? today : months.at(-1);
    fillMonths(months, key);
    show(key ? await call({ action: "get", key }) : { rounds: [] });
    await loadTomorrow(months);
  } catch (e) {
    $("info").textContent = "Pull failed: " + e.message;
  }
}

$("month").onchange = async (e) => {
  $("info").textContent = "กำลัง Pull จาก Server…";
  try { show(await call({ action: "get", key: e.target.value })); }
  catch (err) { $("info").textContent = "Pull failed: " + err.message; }
};

// เจ้าของดูได้เสมอ คนอื่นดูได้เมื่อปลดล็อกแล้ว — เซิร์ฟเวอร์เป็นคนตัดสิน
requireLogin(async () => {
  try { await call({ action: "months" }); }
  catch (e) { return location.replace(HUB_URL); }
  document.documentElement.classList.add("allowed");
  start();
});
</script>
