<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<style>html:not(.owner) body{visibility:hidden}</style>
<title>ตารางวันทำงาน</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f5f3;--panel:#fff;--line:#c9c9c3;--ink:#1a1a1a;--mute:#6f6f6a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 'IBM Plex Sans Thai',system-ui,sans-serif;padding:16px}
header,.line{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
header{justify-content:space-between}
h1{font-size:20px;margin:0}
.btn{font:inherit;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer}
.mute{color:var(--mute);font-size:13px}
.scroll{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px}
table{border-collapse:separate;border-spacing:0;font-size:12px;text-align:center;white-space:nowrap;min-width:100%}
th,td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:3px 4px;min-width:28px;background:var(--panel)}
thead th{position:sticky;top:0;background:#d9d9d6;z-index:2}
thead tr+tr th{top:26px;background:#e8e8e4;font-weight:400}
.name{position:sticky;left:0;z-index:1;text-align:left;min-width:170px}
thead .name{z-index:3}
.we{color:#b3261e}
td.D{background:#ffe94a}td.N{background:#29b6f6}td.DO{background:#f2332b;color:#ffe94a}td.AL{background:#92d050;font-weight:600}
td.V{background:#7030a0;color:#fff}td.L{background:#f4a460}
td.chg{outline:3px solid #111;outline-offset:-3px;font-weight:600;cursor:pointer}
tr.sum td{font-weight:500}
.key span{padding:1px 9px;border:1px solid var(--line);font-size:12px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin-top:10px}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.stats div{background:var(--bg);border-radius:8px;padding:6px 14px;min-width:110px}
.stats b{display:block;font-size:20px;font-weight:600}
.round{margin-top:14px;font-weight:600}
.log{margin-top:4px;text-align:left;min-width:0;border-top:1px solid var(--line);border-left:1px solid var(--line)}
.log th,.log td{padding:4px 10px;text-align:left}
.log th{background:#e8e8e4;font-weight:500}
.log .chip{display:inline-block;min-width:30px;text-align:center;border:1px solid var(--line);padding:0 6px}
.chip.D{background:#ffe94a}.chip.N{background:#29b6f6}.chip.DO{background:#f2332b;color:#ffe94a}.chip.AL{background:#92d050}.chip.V{background:#7030a0;color:#fff}.chip.L{background:#f4a460}
.low{color:#b3261e;font-weight:600}
</style>
</head>
<body>
<header>
  <div><h1>ตารางวันทำงาน</h1><div id="title"></div></div>
  <div class="line">
    <a class="btn" href="Access-Hub.html" style="color:inherit;text-decoration:none">กลับหน้าหลัก</a>
    <select id="month" class="btn" hidden></select>
    <input id="q" class="btn" placeholder="ค้นหาชื่อ / กลุ่ม">
  </div>
</header>
<div id="note" class="mute line"></div>
<div class="scroll"><table id="t"></table></div>
<div id="info" class="line" style="min-height:22px;margin-top:8px"></div>
<div class="line key">
  <span style="background:#ffe94a">D เช้า</span><span style="background:#29b6f6">N ดึก</span><span style="background:#f2332b;color:#ffe94a">DO หยุด</span>
  <span style="background:#92d050">AL นักขัตฤกษ์</span><span style="background:#7030a0;color:#fff">พร พักร้อน</span><span style="background:#f4a460">ป / ก / ข ลา-ขาด</span>
</div>
<div class="panel"><b>สรุปการเปลี่ยนแปลง</b><div id="log"></div></div>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const CLS = { D: 'D', N: 'N', DO: 'DO', AL: 'AL', 'พร': 'V', 'ป': 'L', 'ก': 'L', 'ข': 'L' };

// ตารางมาจาก shift-sync/sync.ps1 → apps-script/shifts.gs หน้านี้ดูอย่างเดียว
let data = { title: 'กำลังโหลด...', days: [], week: [], people: [] };
let rounds = []; // ใหม่สุดอยู่บน
let changes = [];

const dayLabel = (i) => `${data.week[i]} ${data.days[i]}${i < data.days.indexOf(1) ? ' (เดือนก่อน)' : ''}`;
const chip = (c) => `<span class="chip ${CLS[c] || ''}">${esc(c)}</span>`;
const delta = ([a, b]) => (a === b ? String(b) : `<span class="${b < a ? 'low' : ''}">${a} → ${b}</span>`);

const stamp = (t) => new Date(t).toLocaleString('th-TH', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });

function renderLog() {
  if (!rounds.length) { $('log').innerHTML = '<div class="mute">ยังไม่มีการเปลี่ยนแปลง</div>'; return; }
  const stats = [[rounds.length, 'ครั้งที่แก้'], [changes.length, 'รายการที่เปลี่ยน'], [new Set(changes.map((c) => c.id)).size, 'คนที่โดนเปลี่ยน'], [new Set(changes.filter((c) => c.i !== undefined).map((c) => c.i)).size, 'วันที่กระทบ']];
  let html = '<div class="stats">' + stats.map(([v, t]) => `<div><b>${v}</b>${t}</div>`).join('') + '</div>';
  for (const r of rounds) {
    html += `<div class="round">แก้เมื่อ ${esc(typeof r.when === 'number' ? stamp(r.when) : r.when)} · ${r.list.length} รายการ</div>`;
    html += '<div style="display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start;overflow:auto">';
    html += '<table class="log"><tr><th>ชื่อ</th><th>วันที่</th><th>เดิม → ใหม่</th></tr>' + r.list.map((c) => `<tr><td>${esc(c.name)}</td>` + (c.i === undefined ? `<td colspan="2">${esc(c.text)}</td>` : `<td>${esc(dayLabel(c.i))}</td><td>${chip(c.from)} → ${chip(c.to)}</td>`) + '</tr>').join('') + '</table>';
    if (r.impact.length) html += '<table class="log"><tr><th>กำลังคนวันที่</th><th>เช้า</th><th>ดึก</th></tr>' + r.impact.map((x) => `<tr><td>${esc(dayLabel(x.i))}</td><td>${delta(x.d)}</td><td>${delta(x.n)}</td></tr>`).join('') + '</table>';
    html += '</div>';
  }
  $('log').innerHTML = html;
}

function render() {
  changes = rounds.flatMap((r) => r.list);
  const q = $('q').value.trim().toLowerCase();
  const shown = data.people.filter((p) => (p.name + p.group).toLowerCase().includes(q));
  const count = (list, code) => list.filter((c) => c === code).length;
  const we = (i) => (/^(ส|อา)$/.test(data.week[i]) ? ' class="we"' : '');
  let html = '<thead><tr><th class="name">ชื่อ - สกุล</th><th>กลุ่ม</th>' + data.days.map((d) => `<th>${d}</th>`).join('') + '<th>D</th><th>N</th><th>DO</th><th>AL</th></tr>';
  html += '<tr><th class="name"></th><th></th>' + data.week.map((w, i) => `<th${we(i)}>${esc(w)}</th>`).join('') + '<th></th><th></th><th></th><th></th></tr></thead><tbody>';
  for (const p of shown) {
    html += `<tr><td class="name">${esc(p.name)}</td><td>${esc(p.group)}</td>` + p.codes.map((c, i) => {
      const k = changes.findIndex((x) => x.id === p.id && x.i === i);
      return `<td class="${CLS[c] || ''}${k >= 0 ? ' chg' : ''}"${k >= 0 ? ` data-k="${k}" title="เดิม ${esc(changes[k].from)}"` : ''}>${esc(c)}</td>`;
    }).join('') + ['D', 'N', 'DO', 'AL'].map((c) => `<td>${count(p.codes, c)}</td>`).join('') + '</tr>';
  }
  for (const [code, label] of [['D', 'กะเช้า'], ['N', 'กะดึก'], ['DO', 'วันหยุด']]) {
    html += `<tr class="sum"><td class="name">รวม${label}</td><td></td>` + data.days.map((_, i) => `<td>${count(data.people.map((p) => p.codes[i]), code)}</td>`).join('') + '<td></td><td></td><td></td><td></td></tr>';
  }
  $('t').innerHTML = html + '</tbody>';
  $('title').textContent = data.title;
  renderLog();
  $('note').textContent = `${data.people.length} คน · เปลี่ยน ${changes.length} รายการ (ช่องกรอบหนา กดดูของเดิม)`;
}

$('q').oninput = render;
$('t').onclick = (e) => {
  const k = e.target.dataset.k;
  if (k !== undefined) $('info').textContent = `${changes[k].name} · ${changes[k].text}`;
};
render();
</script>
<script type="module">
import { requireLogin, fetchProtectedText, HUB_URL } from "./firebase-guard.js?v=20261122-cut";
import { isOwner } from "./owner.js";

// URL /exec ของ apps-script/shifts.gs
const SHIFTS_URL = "https://script.google.com/macros/s/AKfycbzbv4mvsrhJuQrKXJoknD1WKC8xdLCi-K0J4i12kLoeKsAVaAYgtd5b3YDl8ermmC9MDQ/exec";

const MONTHS = ["มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน", "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"];
const call = async (body) => JSON.parse(await fetchProtectedText(SHIFTS_URL, body));
const label = (key) => `${MONTHS[Number(key.slice(6)) - 1]} ${key.slice(1, 5)}`;

function show(res) {
  data = res.data || { title: "ยังไม่มีตาราง", days: [], week: [], people: [] };
  rounds = res.rounds;
  render();
  $("info").textContent = res.version ? "บันทึกล่าสุด " + stamp(res.version) : "";
}

function fillMonths(keys, selected) {
  $("month").innerHTML = keys.map((k) => `<option value="${esc(k)}">${esc(label(k))}</option>`).join("");
  $("month").value = selected;
  $("month").hidden = !keys.length;
}

async function start() {
  try {
    const { months } = await call({ action: "months" });
    // เปิดเดือนปัจจุบันก่อน ไม่มีก็เดือนล่าสุด
    const now = new Date();
    const today = `m${now.getFullYear() + 543}-${String(now.getMonth() + 1).padStart(2, "0")}`;
    const key = months.includes(today) ? today : months.at(-1);
    fillMonths(months, key);
    show(key ? await call({ action: "get", key }) : { rounds: [] });
  } catch (e) {
    $("info").textContent = "โหลดไม่สำเร็จ: " + e.message;
  }
}

$("month").onchange = async (e) => {
  $("info").textContent = "กำลังโหลด...";
  try { show(await call({ action: "get", key: e.target.value })); }
  catch (err) { $("info").textContent = "โหลดไม่สำเร็จ: " + err.message; }
};

// บัญชีอื่นเปิดลิงก์ตรง → พากลับหน้าหลัก
requireLogin(async (user) => {
  if (!(await isOwner(user))) return location.replace(HUB_URL);
  document.documentElement.classList.add("owner");
  start();
});
</script>
</body>
</html>
